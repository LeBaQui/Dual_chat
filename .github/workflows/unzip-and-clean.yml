name: Extract zip into repo root and push

on:
  workflow_dispatch:

jobs:
  extract-root:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check zip exists
        shell: bash
        run: |
          set -e
          if [ ! -f "DualAiGrammar.zip" ]; then
            echo "Không tìm thấy file zip: DualAiGrammar.zip"
            exit 1
          fi
          echo "Tìm thấy file zip: DualAiGrammar.zip"

      - name: Extract zip into repo root
        shell: bash
        run: |
          set -e
          unzip -o "DualAiGrammar.zip" -d .
          echo "Danh sách file sau khi giải nén:"
          find . -maxdepth 2 -type f | sort

      - name: Commit and push extracted files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Không có thay đổi nào để commit."
            exit 0
          fi

          git commit -m "Extract DualAiGrammar.zip into repo root"
          git push origin HEAD:${GITHUB_REF_NAME}
